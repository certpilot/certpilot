name: Images

# Every Dockerfile in this tree was unverified until this job existed, and one
# of them could not have built: the frontend image copied nginx.conf from
# outside its own build context. That is how they got there — nothing ever
# tried. A job that builds every one of them on each pull request is the only
# thing that keeps them from rotting back to the same state.
#
# No runtime was available on the machine these were written on, so this job is
# also where they were verified for the first time.
on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'deploy/docker/**'
      - 'deploy/docker-compose*.yml'
      - 'deploy/config.quickstart.yaml'
      - '.github/workflows/images.yml'
      - 'go.work'
      - '**/go.mod'
      - '**/go.sum'
      - 'core/**'
      - 'agent/**'
      - 'pkg/**'
      - 'frontend/**'
      - 'migrations/**'
      - 'config.example.yaml'
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Deliberately not a plausible version. If this ever leaks into a published
  # image, it should be obvious rather than look like a release.
  STAMP: 0.0.0-ci-stamp-check

jobs:
  build:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # Every image, every time. Stopping at the first failure would report one
      # broken Dockerfile per run, and there is more than one to find.
      fail-fast: false
      matrix:
        include:
          - name: core
            dockerfile: deploy/docker/core.Dockerfile
          - name: agent
            dockerfile: deploy/docker/agent.Dockerfile
          - name: frontend
            dockerfile: deploy/docker/frontend.Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          # The repository root: this is a Go workspace and core and agent both
          # replace ../pkg, so a context rooted at a module cannot resolve its
          # own dependency. The frontend needs the root too, for
          # deploy/docker/nginx.conf.
          #
          # The gateways used to be built here as well and no longer are. They
          # are separate repositories publishing their own images, and each one
          # builds from a context of its own module — which is what dropping the
          # replace directives bought.
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: certpilot/${{ matrix.name }}:ci
          # A sentinel the next step asserts the binary reports back. An ldflags
          # -X path that does not match a real symbol fails silently — the build
          # succeeds and the binary keeps its compiled-in default for ever — so
          # the stamp has to be checked rather than trusted. This is the check.
          build-args: |
            VERSION=${{ env.STAMP }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Building proves it compiles. This proves the binary in the image is the
      # right one and can actually start — a Go binary built for the wrong
      # architecture, or a CMD naming a path that is not there, both build
      # perfectly and fail here.
      - name: Run it
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            frontend)
              # nginx resolves every proxy_pass upstream when it tests the
              # config, and `core` only exists on the compose network — so a
              # bare `nginx -t` fails on a perfectly good image. Point the name
              # at loopback to check the syntax without the service.
              docker run --rm --add-host core:127.0.0.1 \
                certpilot/${{ matrix.name }}:ci nginx -t
              docker run --rm certpilot/${{ matrix.name }}:ci \
                test -s /usr/share/nginx/html/index.html
              ;;
            *)
              docker run --rm certpilot/${{ matrix.name }}:ci --help >/dev/null

              # The stamp, asserted rather than printed. Before this, --version
              # was run with `2>/dev/null || true` — it could not fail, so it
              # proved nothing about a value an operator reads off a running
              # fleet to decide what is out of date.
              got="$(docker run --rm certpilot/${{ matrix.name }}:ci --version)"
              if [ "$got" != "${{ env.STAMP }}" ]; then
                echo "::error::${{ matrix.name }} reports version '$got', expected '${{ env.STAMP }}'."
                echo "::error::The -ldflags -X path in ${{ matrix.dockerfile }} no longer names a real symbol."
                exit 1
              fi
              echo "${{ matrix.name }} reports the version it was stamped with"
              ;;
          esac

      - name: Confirm it does not run as root
        # Excludes the frontend: the stock nginx image starts as root to bind
        # port 80 and drops to nginx for workers.
        if: matrix.name != 'frontend'
        run: |
          set -euo pipefail
          # --entrypoint is the whole point of this line. Every image here sets
          # ENTRYPOINT to its binary, so `docker run IMAGE id -u` does not run
          # id — it passes "id -u" to the binary as arguments. The core ignores
          # them, falls back to its built-in development defaults, starts
          # listening and never exits, hanging the job until the six-hour
          # timeout. The gateways, when they were built here, exited non-zero
          # instead — which made this check report success without ever reading
          # a uid.
          uid="$(timeout 30 docker run --rm --entrypoint id \
            certpilot/${{ matrix.name }}:ci -u)"
          if [ "$uid" = "0" ]; then
            echo "::error::${{ matrix.name }} runs as root"
            exit 1
          fi
          echo "${{ matrix.name }} runs as uid $uid"

  # The quickstart, actually run. `docker compose config` proves a file parses;
  # only this proves the thing starts, reaches its database, and completes the
  # mTLS handshake the product is about.
  quickstart:
    name: quickstart stack
    runs-on: ubuntu-latest
    # The gateway is pulled now rather than built, so this job needs to be able
    # to read ghcr.io/certpilot/gateway-selfsigned. A package published by
    # another repository in this organisation is not readable by this one's
    # token unless the package is public or has granted access — so if this job
    # fails on an unauthorized pull, that is the reason, and the fix is the
    # package's visibility rather than anything in this file.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bring it up
        run: docker compose -f deploy/docker-compose.quickstart.yml up -d --build

      - name: The core answers
        run: |
          curl -fsS --retry 40 --retry-delay 3 --retry-all-errors \
            http://localhost:8080/healthz

      - name: The console is served
        run: |
          curl -fsS --retry 20 --retry-delay 3 --retry-all-errors \
            http://localhost:3000/ | grep -q '<div id="app"'

      # The roadmap bullet this job exists for. A failed gateway connection is
      # only a warning in the core — it starts anyway — so a healthy core proves
      # nothing on its own. The absence of this line is the proof that mTLS
      # survived the compose network, service names and all.
      - name: mTLS reached the gateway
        run: |
          set -euo pipefail
          logs="$(docker compose -f deploy/docker-compose.quickstart.yml logs core)"
          if grep -q "could not connect to configured gateway at startup" <<<"$logs"; then
            echo "::error::the core could not reach gateway-selfsigned over mTLS"
            grep -A3 "could not connect to configured gateway" <<<"$logs"
            exit 1
          fi
          echo "the core registered its gateway over mTLS"

      # And that it did not get there by giving up on TLS.
      - name: The gateway is not running without TLS
        run: |
          set -euo pipefail
          logs="$(docker compose -f deploy/docker-compose.quickstart.yml logs gateway-selfsigned)"
          if grep -qi "WITHOUT TLS" <<<"$logs"; then
            echo "::error::the quickstart gateway is serving without TLS"
            exit 1
          fi
          echo "the gateway is serving with TLS"

      - name: Logs, if any of that failed
        if: failure()
        run: docker compose -f deploy/docker-compose.quickstart.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.quickstart.yml down -v

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches a malformed compose file, an unresolvable build context and a
      # service naming a Dockerfile that is not there — without needing the
      # secrets a real `up` would want.
      - name: Validate both compose files
        run: |
          set -euo pipefail
          CERTPILOT_KEK=ci CERTPILOT_DB_URL=postgres://ci \
            docker compose -f deploy/docker-compose.yml config -q
          echo "deploy/docker-compose.yml is valid"
          docker compose -f deploy/docker-compose.quickstart.yml config -q
          echo "deploy/docker-compose.quickstart.yml is valid"
