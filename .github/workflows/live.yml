name: Against the real thing

# The checks that turned a 🧪 on docs/status.md into a ✅. Each runs the core
# built from this commit against an independent implementation of what it
# talks to — a mail server, an identity provider — started inside the job, so
# none needs a secret and none can be skipped for want of one.
#
# Separate from ci.yml so a red run here reads as what it is: CertPilot and a
# real counterpart disagreeing, not a unit test failing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily, for the checks that depend on a public service being up. The others
  # run too, which costs a few minutes and catches a pinned image going away.
  schedule:
    - cron: "23 5 * * *"

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notifications:
    name: alerts, to Mailpit and a webhook receiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      # Linux, so the core is handed the check's CA through SSL_CERT_FILE and
      # the STARTTLS certificate is verified rather than skipped.
      - name: Email and webhook delivery, and a CA expiry alert
        run: make live-notifications

  oidc:
    name: sign-in, against Keycloak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Authorization code with PKCE, bearer tokens, refusals, key rotation
        run: make live-oidc

  ct:
    name: CT, against crt.sh
    # crt.sh is a free community service and answers 502 often enough that a
    # pull request must not wait on it. The script retries; a run that still
    # fails is worth reading, and belongs here rather than on somebody's change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: A public site's certificate, found in crt.sh and matched to the inventory
        run: make live-ct
