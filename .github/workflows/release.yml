name: Release

# Tags only.
#
# This published on every merge to main, which meant two multi-architecture
# builds of three images for changes that were often a paragraph of
# documentation — and it moved `latest` each time, so a `docker compose pull`
# could change what a deployment was running without anybody deciding to.
#
# Building still happens on every pull request, in images.yml, which is where a
# broken Dockerfile should be caught. Only publishing is tied to a tag now, so
# `latest` means "the most recent release" rather than "the most recent merge".
#
# workflow_dispatch stays for republishing a tag whose run failed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    # images.yml builds these on every pull request and pushes none of them,
    # which was the right shape while a gateway sat in the same tree and the
    # compose files built everything from source. It is not any more: the
    # gateways and the agent publish their own images from their own
    # repositories, and a quickstart that pulls three of five services and
    # builds the other two is a quickstart that still needs a Go toolchain to
    # try.
    #
    # So building stays on the pull request, where it catches a broken
    # Dockerfile before it merges, and publishing happens here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dockerfile: deploy/docker/core.Dockerfile
            context: .
          - name: frontend
            dockerfile: deploy/docker/frontend.Dockerfile
            context: .

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/certpilot/${{ matrix.name }}
          # latest=auto attaches `latest` to a semver tag and to nothing else,
          # so a prerelease or a manual run from a branch cannot claim it.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          # The core replaces ../pkg and so needs the workspace root; the
          # frontend needs it for deploy/docker/nginx.conf. Kept as a matrix
          # field rather than hard-coded, because the next image to need
          # something else should not have to reintroduce it.
          #
          # ghcr.io/certpilot/agent is published from certpilot-agent now. Same
          # image name, new source repository, so nothing that pulls it had to
          # change.
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Both architectures, because the machines people evaluate this on are
          # increasingly not amd64 and an image that will not start says nothing
          # useful about the product. Each Dockerfile cross-compiles from the
          # build platform rather than being emulated — Go does that natively
          # with CGO off, and QEMU would spend minutes producing an identical
          # binary.
          platforms: linux/amd64,linux/arm64
          # The version the binary reports about itself. steps.meta gives the
          # tag without its leading v, and empty for a manual branch run — which
          # is what the Dockerfiles treat as "do not stamp", leaving the -dev
          # default rather than a release number this build is not.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: publish release
    # The release page. Nothing used to create one: the gateways and their SDK
    # were tagged v0.3.0 and served that way for nine days while each Releases
    # page still said v0.2.0, because the page was a step somebody had to
    # remember (#101).
    #
    # After both images, so a page never announces an image that failed to
    # publish. Only for a tag: a manual run from a branch has nothing to
    # release.
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Re-running a tag's workflow, or a release written by hand before this
          # ran, must neither fail nor overwrite what is there.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release; leaving it as it is."
            exit 0
          fi

          # An annotated tag's message is the release notes, written by whoever cut
          # the tag. A lightweight tag carries none, so GitHub lists the pull
          # requests merged since the previous release instead.
          notes=(--generate-notes)
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
            gh api "repos/$GH_REPO/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .message \
              | sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' > "$RUNNER_TEMP/notes.md"
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          fi

          # Latest only for the highest version. A fix to an older line must not
          # take the badge from the newest one, and a prerelease never has it.
          flags=(--latest=false)
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          else
            highest=$(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
            [ "$highest" = "$TAG" ] && flags=(--latest=true)
          fi

          gh release create "$TAG" --verify-tag --title "$TAG" "${notes[@]}" "${flags[@]}"
