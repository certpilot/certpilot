name: Tell the docs site

# The documentation site vendors these pages rather than building from this
# checkout, so that its build needs no Go toolchain. The cost of vendoring is
# drift, and the cost of closing drift on a schedule is delay: before this,
# a page merged here on a Tuesday reached readers the following Monday at the
# earliest, and only if somebody merged the pull request the cron opened.
#
# This closes it to minutes. One dispatch, no build, no checkout of the site.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      # The default GITHUB_TOKEN is scoped to this repository and cannot
      # dispatch to another one, so this needs a token that can: a fine-grained
      # PAT or app token with contents:write on certpilot/certpilot-docs,
      # stored here as DOCS_SYNC_TOKEN.
      - name: Ask certpilot-docs to sync
        env:
          TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          # Missing secret is an error, not a shrug. The weekly cron on the
          # docs side still covers it, so nothing is broken — but a dispatch
          # that silently never fires is indistinguishable from one that works,
          # and the whole reason this file exists is that a documentation
          # pipeline failing quietly is how eleven pages went unpublished for
          # months.
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::DOCS_SYNC_TOKEN is not set, so the docs site was not told about this change."
            echo "::error::It will pick it up on its weekly cron instead. To fix: create a token with"
            echo "::error::contents:write on certpilot/certpilot-docs and add it as DOCS_SYNC_TOKEN here."
            exit 1
          fi

          code="$(curl -sS -o /tmp/body -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/certpilot/certpilot-docs/dispatches \
            -d "$(printf '{"event_type":"upstream-docs-changed","client_payload":{"sha":"%s"}}' "$GITHUB_SHA")")"

          # 204 is the documented success. Anything else is reported with the
          # body, because a 403 here means a token problem and a 404 means the
          # token cannot see the repository at all — two different fixes that
          # look identical without the message.
          if [ "$code" != "204" ]; then
            echo "::error::dispatch to certpilot-docs returned $code"
            cat /tmp/body
            exit 1
          fi
          echo "certpilot-docs was told about $GITHUB_SHA"
