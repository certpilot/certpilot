name: Route inventory

# docs/routes.json is what the documentation site is built from. If it is
# allowed to drift from the code, the published reference is wrong and nothing
# says so — which is the failure mode generating it was meant to remove in the
# first place.
#
# The inventory is now built from two passes over different files, so the
# trigger list below is wider than the router. extract-routes.py reads the
# router for what exists and who may call it; schemagen reads the handlers and
# the store for what to send, what comes back, and which refusals are possible.
# A request struct gaining a field is exactly the drift this job exists to
# catch, and watching only router.go would have missed every one of them.
on:
  pull_request:
    paths:
      - 'core/api/**'
      - 'core/store/**'
      - 'core/server/middleware/auth.go'
      - 'core/server/middleware/display_token.go'
      # Not a file in this repository any more. schemagen reads agentauth.go
      # out of the module cache, so what the published reference says about the
      # agent's headers is decided by the version core/go.mod resolves — and
      # this list watched `pkg/agentauth/agentauth.go`, which #44 deleted when
      # the SDK moved to its own repository. Bumping the SDK has therefore been
      # able to change routes.json with this job never running, which is the
      # drift it exists to catch.
      - 'core/go.mod'
      - 'scripts/extract-routes.py'
      - 'scripts/schemagen/main.go'
      - 'scripts/test-routes-atomicity.sh'
      - 'docs/routes.json'
      - 'Makefile'
  workflow_dispatch:

jobs:
  check:
    name: route inventory is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Regenerate the route inventory
        run: make routes

      - name: Fail if it changed
        run: |
          if ! git diff --quiet -- docs/routes.json; then
            echo "::error::docs/routes.json is out of date. Run: make routes"
            git --no-pager diff -- docs/routes.json
            exit 1
          fi
          echo "Route inventory is current."

      # Asserted rather than trusted, because the defect class is a step that
      # reports failure while having already damaged the checked-in file. The
      # script runs the real recipe with a generator rigged to fail, five
      # different ways, and checks the inventory is byte-identical after each.
      - name: A failing generator leaves the inventory alone
        run: ./scripts/test-routes-atomicity.sh
