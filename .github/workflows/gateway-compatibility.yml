name: Gateway compatibility

# Does the core still work with the gateways that are released?
#
# When the gateways lived in this repository, a change that broke the
# core-to-gateway channel failed before it merged. They do not any more: each is
# its own repository, released on its own schedule, and nothing was left asking
# that question. The failure mode is a contract that drifted weeks ago and is
# found by whoever deploys next.
#
# Scheduled rather than only on pull requests because the other half moves
# independently. A gateway can release on a Tuesday and break a core that has
# not changed at all, and no pull request here would ever run.
#
# It also runs on a pull request that touches the contract surface, so that
# breaking it is visible in the change that does it rather than on the following
# Monday.

on:
  schedule:
    # Monday morning, so a break is found at the start of a working week rather
    # than discovered on a Friday afternoon deploy.
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'core/go.mod'
      - 'core/engine/gateway/**'
      - 'core/api/ca_accounts.go'
      - 'pkg/config/config.go'
      - 'scripts/gateway-compatibility.sh'
      - '.github/workflows/gateway-compatibility.yml'
      - 'Makefile'
  workflow_dispatch:

# The scheduled run opens a pull request when the table changes, so it needs to
# be able to write one.
permissions:
  contents: write
  pull-requests: write

jobs:
  compatibility:
    name: core against the released gateways
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      # The ACME gateway reaches Let's Encrypt staging during its health check,
      # so this job needs outbound network. That is deliberate: a gateway that
      # cannot reach its CA is exactly the thing worth knowing about, and
      # stubbing it would make the result meaningless.
      - name: Measure
        id: measure
        run: ./scripts/gateway-compatibility.sh
        continue-on-error: true

      - name: Show the table
        run: cat docs/compatibility.md >> "$GITHUB_STEP_SUMMARY"

      # The logs are the difference between "acme failed" and knowing why, and
      # the why is usually one line inside the probe output.
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-logs
          path: .compat/*.log
          if-no-files-found: warn
          retention-days: 30

      # On a pull request the table is a check: it must already be current, the
      # same rule docs/routes.json lives under.
      - name: The table is current
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- docs/compatibility.md; then
            echo "::error::docs/compatibility.md is out of date. Run: ./scripts/gateway-compatibility.sh"
            git --no-pager diff -- docs/compatibility.md
            exit 1
          fi
          echo "Compatibility table is current."

      # On a schedule there is no pull request to fail, so a change becomes one.
      - name: Open a pull request when it changed
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- docs/compatibility.md; then
            echo "No change."
            exit 0
          fi

          branch="compat/$(date -u +%Y-%m-%d)"
          git config user.name  "certpilot-ci"
          git config user.email "ci@certpilot.invalid"
          git checkout -b "$branch"
          git add docs/compatibility.md
          git commit -m "Gateway compatibility as measured on $(date -u +%Y-%m-%d)

          Generated by .github/workflows/gateway-compatibility.yml. The table is
          produced by starting each released gateway and talking to it, so a
          change here is a change in what actually works rather than in what
          somebody remembered to update."
          git push -u origin "$branch"

          gh pr create \
            --title "Gateway compatibility, $(date -u +%Y-%m-%d)" \
            --body "The scheduled compatibility job measured something different from what is committed.

          This is generated by \`scripts/gateway-compatibility.sh\`, which starts each released gateway and talks to it: the conformance probe from the gateway SDK, then a core built from this repository dialling it over mutual TLS.

          A row that changed to a failure means the pair stopped working — the gateway released something the core cannot use, or this core changed under a gateway that has not. The probe output for each gateway is attached to the workflow run as \`compatibility-logs\`.

          Verified by the job that produced it; the table below is its output, not a summary of it." \
            --base main

      # Last, so that the table and the logs are published even when a pair is
      # broken. A red job with no evidence in it is a job people learn to
      # re-run rather than read.
      - name: Fail if any pair is broken
        if: steps.measure.outcome != 'success'
        run: |
          echo "::error::At least one core/gateway pair failed. See docs/compatibility.md above and the compatibility-logs artifact."
          exit 1
