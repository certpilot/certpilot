# Weekly. Minor and patch updates arrive grouped, one pull request per
# ecosystem; a major version arrives on its own, because that is the one
# that can break something and deserves its own review. Security updates
# are not held for the schedule: GitHub opens them as soon as an advisory
# lands.
version: 2
updates:
  # One entry for every module, so a workspace's modules move together and stay tidy.
  - package-ecosystem: gomod
    directories:
      - "/core"
      - "/pkg"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "dependencies"
      - "no-verification-needed"
    groups:
      gomod:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "dependencies"
      - "no-verification-needed"
    groups:
      npm:
        update-types: ["minor", "patch"]
  # Base images: the runtime stage is what ships.
  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "dependencies"
      - "no-verification-needed"
    groups:
      docker:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "dependencies"
      - "no-verification-needed"
    groups:
      github_actions:
        update-types: ["minor", "patch"]
