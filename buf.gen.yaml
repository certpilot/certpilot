version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/certpilot/certpilot-gateway-sdk/pb
plugins:
  - remote: buf.build/protocolbuffers/go
    out: pkg/gatewaysdk/pb
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: pkg/gatewaysdk/pb
    opt: paths=source_relative
