# HSTS only means something over HTTPS, and TLS ends in front of this server,
# so it is sent when that proxy says the browser arrived over HTTPS. An empty
# value is not sent at all, which is what a plain-HTTP evaluation gets.
map $http_x_forwarded_proto $certpilot_hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # The console is where an administrator revokes certificates and reads
    # private keys, so a script injected into it would act with that session.
    #
    # Scripts and styles come only from this origin; nothing is inline. connect-src
    # allows https: as well because sign-in fetches the identity provider's
    # discovery document from the browser, and that origin is a deployment's,
    # not something this file can name. frame-ancestors refuses framing outright.
    #
    # Referrer-Policy: a wall display carries its token in the URL, because
    # EventSource cannot send a header, and no-referrer keeps it from leaving
    # in the Referer of anything followed from that page.
    #
    # Only on the console's own files: the API's responses carry the headers
    # the core sets, and adding them here as well would send each one twice.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security $certpilot_hsts always;
    }

    # The live event stream.
    #
    # This block must come before the generic /api/ one: nginx buffers proxied
    # responses by default, which would hold the stream until a buffer filled
    # and make a dashboard that had stopped updating look merely quiet. On a
    # wall display that is the worst failure available — it reports "no
    # problems" precisely when the tool has stopped being able to see problems.
    location /api/v1/events {
        proxy_pass http://core:8080/api/v1/events;
        proxy_http_version 1.1;

        # Clear Connection so the upstream keep-alive is not turned into an
        # upgrade attempt.
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;

        # A stream is idle between events by design; the core heartbeats every
        # 15s, so anything well above that is safe.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://core:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://core:8080/healthz;
        proxy_set_header Host $host;
    }

    # Without this the console's catch-all answers /readyz with index.html and
    # a 200, so a load balancer probing the console would never see the core
    # lose its database.
    location /readyz {
        proxy_pass http://core:8080/readyz;
        proxy_set_header Host $host;
    }
}
