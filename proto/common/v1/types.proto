syntax = "proto3";

package certpilot.common.v1;

option go_package = "github.com/certpilot/certpilot-gateway-sdk/pb/common/v1;commonv1";

import "google/protobuf/timestamp.proto";

// CertificateInfo represents a full certificate with all its details.
message CertificateInfo {
  string id = 1;
  string common_name = 2;
  repeated string sans = 3;
  string serial_number = 4;
  string issuer_dn = 5;
  string subject_dn = 6;
  google.protobuf.Timestamp not_before = 7;
  google.protobuf.Timestamp not_after = 8;
  string key_type = 9;       // RSA, ECDSA, Ed25519
  int32 key_size = 10;
  string fingerprint_sha256 = 11;
  bytes certificate_pem = 12;
  bytes chain_pem = 13;
  bytes private_key_pem = 14; // Only populated when issuing/renewing
}

// CAAuthorityInfo contains information about a Certificate Authority.
message CAAuthorityInfo {
  string id = 1;
  string name = 2;
  string subject_dn = 3;
  string issuer_dn = 4;
  google.protobuf.Timestamp not_before = 5;
  google.protobuf.Timestamp not_after = 6;
  int32 days_remaining = 7;
  string fingerprint_sha256 = 8;
  string ca_type = 9;             // ROOT, INTERMEDIATE, ISSUING
  string crl_url = 10;
  string ocsp_url = 11;
  bool is_crl_fresh = 12;
  bool is_ocsp_responsive = 13;
  int64 certificates_issued_count = 14;
  bytes certificate_pem = 15;
}

// HealthStatus represents the health state of a component.
enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}

// ProviderCapabilities describes what a gateway plugin supports.
message ProviderCapabilities {
  string provider_name = 1;
  string provider_version = 2;
  string provider_type = 3;          // acme, vault, selfsigned, gcp_cas, etc.
  bool supports_wildcard = 4;
  bool supports_multi_domain = 5;
  repeated string supported_key_types = 6;      // RSA, ECDSA, Ed25519
  repeated string supported_challenges = 7;     // http-01, dns-01, tls-alpn-01
  repeated string validation_levels = 8;        // DV, OV, EV
  bool supports_revocation = 9;
  bool supports_ca_info = 10;                   // Can report CA certificate details
  string description = 11;
}
