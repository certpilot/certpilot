syntax = "proto3";

package certpilot.provider.v1;

option go_package = "github.com/certpilot/certpilot-gateway-sdk/pb/provider/v1;providerv1";

import "google/protobuf/timestamp.proto";
import "common/v1/types.proto";

// CertificateProviderService is the gRPC contract that every gateway plugin
// must implement. The CertPilot core communicates with gateways exclusively
// through this interface.
service CertificateProviderService {
  // ── Lifecycle ───────────────────────────────────────────
  
  // IssueCertificate requests a new certificate from the CA.
  rpc IssueCertificate(IssueCertificateRequest) returns (IssueCertificateResponse);
  
  // RenewCertificate renews an existing certificate.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
  
  // RevokeCertificate revokes a previously issued certificate.
  rpc RevokeCertificate(RevokeCertificateRequest) returns (RevokeCertificateResponse);

  // ── Status & Info ───────────────────────────────────────

  // GetCertificateStatus checks the current status of a certificate.
  rpc GetCertificateStatus(GetCertificateStatusRequest) returns (GetCertificateStatusResponse);
  
  // GetCAInfo returns information about the issuing CA (if supported).
  rpc GetCAInfo(GetCAInfoRequest) returns (GetCAInfoResponse);

  // ── Plugin Metadata ─────────────────────────────────────

  // GetCapabilities returns what this gateway supports.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);

  // HealthCheck verifies the gateway is operational and can reach its CA.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // ValidateConfig checks if a given configuration is valid for this gateway.
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
}

// ── Issue ────────────────────────────────────────────────

message IssueCertificateRequest {
  // CSR in PEM format. If empty, the gateway generates the key pair.
  bytes csr_pem = 1;
  // Domains to include in the certificate.
  repeated string domains = 2;
  // Key type to use if generating a key pair (RSA, ECDSA, Ed25519).
  string key_type = 3;
  // Key size (e.g., 2048, 4096 for RSA; 256, 384 for ECDSA).
  int32 key_size = 4;
  // Requested validity duration in days (CA may override).
  int32 validity_days = 5;
  // Provider-specific configuration as JSON.
  string provider_config = 6;
}

message IssueCertificateResponse {
  certpilot.common.v1.CertificateInfo certificate = 1;
  // Provider-specific certificate ID for future operations.
  string provider_certificate_id = 2;
}

// ── Renew ────────────────────────────────────────────────

message RenewCertificateRequest {
  // The provider-specific certificate ID from the original issuance.
  string provider_certificate_id = 1;
  // New CSR in PEM format. If empty, reuses domains from original cert.
  bytes csr_pem = 2;
  // Domains (if different from original).
  repeated string domains = 3;
  // Key type override.
  string key_type = 4;
  int32 key_size = 5;
  // The current certificate PEM (for providers that need it).
  bytes current_certificate_pem = 6;
  // Provider-specific configuration as JSON.
  string provider_config = 7;
}

message RenewCertificateResponse {
  certpilot.common.v1.CertificateInfo certificate = 1;
  string provider_certificate_id = 2;
}

// ── Revoke ───────────────────────────────────────────────

message RevokeCertificateRequest {
  // The certificate to revoke (PEM format).
  bytes certificate_pem = 1;
  // Provider-specific certificate ID.
  string provider_certificate_id = 2;
  // RFC 5280 revocation reason code.
  // 0=unspecified, 1=keyCompromise, 3=affiliationChanged,
  // 4=superseded, 5=cessationOfOperation
  int32 reason = 3;
  // Provider-specific configuration as JSON. Required: a gateway cannot
  // authenticate to the CA without the account credentials.
  string provider_config = 4;
}

message RevokeCertificateResponse {
  bool success = 1;
  string message = 2;
}

// ── Status ───────────────────────────────────────────────

message GetCertificateStatusRequest {
  string provider_certificate_id = 1;
  bytes certificate_pem = 2;
  // Provider-specific configuration as JSON. Needed to reach the CA for
  // renewal information and revocation status.
  string provider_config = 3;
}

message GetCertificateStatusResponse {
  // Certificate status.
  CertStatus status = 1;
  string message = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Renewal guidance published by the CA (RFC 9773). Absent when the CA does
  // not support ACME Renewal Information.
  RenewalWindow renewal_window = 4;
}

// RenewalWindow carries the CA's own advice about when a certificate should be
// replaced, as defined by RFC 9773 (ACME Renewal Information).
//
// Honouring this is what lets a CA drain a mass-revocation event gradually
// instead of every client renewing at once, and it lets the CA move renewals
// off a window it knows is about to become invalid.
message RenewalWindow {
  // Start and end bound the window the CA suggests renewing within. A client
  // should pick a random time inside it rather than renewing at the start.
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  // ExplanationURL points at a human-readable reason, typically set when the
  // CA has brought a renewal window forward.
  string explanation_url = 3;
  // RenewNow is true when the current time falls inside the suggested window.
  bool renew_now = 4;
  // RetryAfterSeconds is how long the CA asks clients to wait before polling
  // renewal information again.
  int64 retry_after_seconds = 5;
}

enum CertStatus {
  CERT_STATUS_UNSPECIFIED = 0;
  CERT_STATUS_VALID = 1;
  CERT_STATUS_EXPIRED = 2;
  CERT_STATUS_REVOKED = 3;
  CERT_STATUS_PENDING = 4;
  CERT_STATUS_UNKNOWN = 5;
}

// ── CA Info ──────────────────────────────────────────────

message GetCAInfoRequest {
  // Provider-specific config to identify which CA to query.
  string provider_config = 1;
}

message GetCAInfoResponse {
  // List of CA authorities in the chain (root → intermediate → issuing).
  repeated certpilot.common.v1.CAAuthorityInfo ca_chain = 1;
}

// ── Capabilities ─────────────────────────────────────────

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  certpilot.common.v1.ProviderCapabilities capabilities = 1;
}

// ── Health Check ─────────────────────────────────────────

message HealthCheckRequest {}

message HealthCheckResponse {
  certpilot.common.v1.HealthStatus status = 1;
  string message = 2;
  // Latency to the CA in milliseconds.
  int64 latency_ms = 3;
  google.protobuf.Timestamp checked_at = 4;
}

// ── Validate Config ──────────────────────────────────────

message ValidateConfigRequest {
  // Configuration JSON to validate.
  string config_json = 1;
}

message ValidateConfigResponse {
  bool valid = 1;
  repeated string errors = 2;
  repeated string warnings = 3;
}
